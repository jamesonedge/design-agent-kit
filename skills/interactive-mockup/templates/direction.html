<!doctype html>

<style>
  :root {

    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.45; }
  .banner { background: #fff4d6; padding: 6px var(--space); font-size: 0.85rem; }
  main { max-width: 960px; margin: 0 auto; padding: var(--space); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
